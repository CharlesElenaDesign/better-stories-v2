<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2P Copilot · Clickable prototype</title>
<style>
  :root{ --brand:#5b5fc7; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* 16:9 stage, contained in the viewport, never cropped. */
  .stage{ position:absolute; left:50%; top:50%; width:min(100vw, 177.78vh); aspect-ratio:16/9; translate:-50% -50%; overflow:hidden; user-select:none; }
  .stage img.screen{ position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0; transition:opacity 380ms ease; pointer-events:none; }
  .stage img.screen.on{ opacity:1; }
  .hot{ position:absolute; border:0; padding:0; margin:0; background:transparent; cursor:pointer; border-radius:8px; z-index:3; }
  .hot:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  .hot.all{ inset:0; border-radius:0; }
  /* Figma-style hint: a stray click flashes where the hotspots are. */
  .stage.flash .hot:not(.all){ background:rgba(91,95,199,.28); box-shadow:0 0 0 2px rgba(91,95,199,.9); }
  .hud{ position:fixed; left:16px; top:16px; z-index:10; display:flex; gap:8px; opacity:0; transition:opacity 300ms ease; }
  body:hover .hud, .hud:focus-within{ opacity:1; }
  .hud a, .hud button{ font:500 13px/1 Inter, system-ui, sans-serif; letter-spacing:.02em; color:#fff; text-decoration:none; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:9px 14px; cursor:pointer; backdrop-filter:blur(6px); }
  .hud a:hover, .hud button:hover{ background:var(--brand); border-color:var(--brand); }
  .count{ position:fixed; right:16px; bottom:14px; z-index:10; font:500 12px/1 Inter, system-ui, sans-serif; color:rgba(255,255,255,.55); letter-spacing:.08em; }
  .end{ position:absolute; inset:auto 0 6% 0; display:none; justify-content:center; z-index:4; }
  .end.show{ display:flex; }
  .end button{ font:600 clamp(13px,1.1vw,18px)/1 Inter, system-ui, sans-serif; color:#fff; background:var(--brand); border:0; border-radius:8px; padding:14px 24px; cursor:pointer; box-shadow:0 6px 24px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="hud">
  <button type="button" id="restart">↺ Restart</button>
  <button type="button" id="fs">⛶ Full screen</button>
</div>
<div class="stage" id="stage" aria-live="polite">
  <img class="screen" id="a" alt="">
  <img class="screen" id="b" alt="">
  <div id="hots"></div>
  <div class="end" id="end"><button type="button" id="again">Replay the story</button></div>
</div>
<div class="count" id="count"></div>

<script>
/* Flow rebuilt from the Figma prototype "INF_TTN_280 Microsoft POC" (flow "Prototype 1", 44 frames, 1920x1080).
   Each screen: t = auto-advance after ms, h = click hotspots [x, y, w, h] in Figma px, all = click anywhere. */
const W = 1920, H = 1080;
const hint = (x, y) => [x, y, 42, 42];
const S = {
  1:{t:800}, 2:{h:[[233,756,148,42],hint(298,804)]}, 3:{h:[[862,676,122,35],hint(919,718)]}, 4:{t:800},
  5:{h:[[1381,906,202,42],hint(1468,955)]}, 6:{h:[[1435,612,57,56],hint(1453,671)]},
  7:{t:1000}, 8:{t:800}, 9:{t:800}, 10:{t:800},
  11:{h:[[243,816,1044,152]]}, 12:{h:[[1203,884,57,56],hint(1215,949)]}, 13:{h:[[484,383,522,377],hint(703,752)]},
  14:{h:[[1528,976,104,35],hint(1641,988)]}, 15:{t:800}, 16:{t:800}, 17:{t:1200},
  18:{h:[[283,766,224,42],hint(370,817)]}, 19:{t:1200}, 20:{h:[[282,885,224,42],hint(373,938)]},
  21:{t:800}, 22:{h:[[234,749,148,42],hint(287,801)]}, 23:{t:800}, 24:{t:800},
  25:{h:[[1712,596,96,32],hint(1739,639)]}, 26:{h:[[487,672,111,32],hint(505,715)]},
  27:{h:[[1444,884,57,56],hint(1453,952)]}, 28:{h:[[1444,884,57,56],hint(1453,952)]}, 29:{all:true},
  30:{h:[[1529,954,213,35],hint(1621,994)]}, 31:{all:true}, 32:{t:800}, 33:{t:1200},
  34:{all:true}, 35:{all:true}, 36:{all:true}, 37:{h:[[94,697,206,42],hint(176,755)]},
  38:{t:1200}, 39:{t:1200}, 40:{all:true}, 41:{all:true}, 42:{all:true}, 43:{all:true}, 44:{end:true}
};
const LAST = 44;
const src = n => `screens/${String(n).padStart(2,'0')}.jpg`;
const stage = document.getElementById('stage'), hots = document.getElementById('hots');
const layers = [document.getElementById('a'), document.getElementById('b')];
const end = document.getElementById('end'), count = document.getElementById('count');
let cur = 0, front = 0, timer = null, history = [];
const cache = {};
function preload(n){ if (n >= 1 && n <= LAST && !cache[n]) { const i = new Image(); i.src = src(n); cache[n] = i; } }

function go(n, push = true){
  if (n < 1 || n > LAST) return;
  clearTimeout(timer);
  if (push && cur) history.push(cur);
  cur = n;
  const next = layers[1 - front];
  const show = () => { next.classList.add('on'); layers[front].classList.remove('on'); front = 1 - front; };
  next.onload = show; next.src = src(n); if (next.complete && next.naturalWidth) { next.onload = null; show(); }
  next.alt = `Screen ${n} of ${LAST}`;
  const s = S[n];
  hots.innerHTML = '';
  if (s.all) addHot(null, n + 1, 'Continue');
  (s.h || []).forEach(r => addHot(r, n + 1, 'Continue'));
  if (s.t) timer = setTimeout(() => go(n + 1, false), s.t);
  end.classList.toggle('show', !!s.end);
  count.textContent = `${n} / ${LAST}`;
  for (let k = 1; k <= 3; k++) preload(n + k);
}
function addHot(r, to, label){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'hot' + (r ? '' : ' all'); b.setAttribute('aria-label', label);
  if (r) Object.assign(b.style, { left: r[0]/W*100+'%', top: r[1]/H*100+'%', width: r[2]/W*100+'%', height: r[3]/H*100+'%' });
  b.addEventListener('click', e => { e.stopPropagation(); go(to); });
  hots.appendChild(b);
}
/* Stray click: flash the hotspots, like Figma does. */
stage.addEventListener('click', () => {
  if (!hots.children.length) return;
  stage.classList.add('flash'); setTimeout(() => stage.classList.remove('flash'), 450);
});
/* Presenter keys: right/space = next step, left = back, R = restart, F = full screen. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); if (cur < LAST) go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'f' || e.key === 'F') fullscreen();
});
function back(){
  // Step back past auto-advancing screens so "back" lands on something you can act on.
  let n = history.pop();
  while (n && S[n].t && history.length) n = history.pop();
  if (n) go(n, false);
}
function restart(){ history = []; go(1, false); }
function fullscreen(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
document.getElementById('restart').onclick = restart;
document.getElementById('again').onclick = e => { e.stopPropagation(); restart(); };
document.getElementById('fs').onclick = fullscreen;
go(1, false);
</script>
</body>
</html>
